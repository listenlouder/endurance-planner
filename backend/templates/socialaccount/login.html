{% extends 'base.html' %}
{% load static %}
{% block title %}Log In — WeAreChecking{% endblock %}

{% block content %}
<div style="display: flex;
             align-items: center;
             justify-content: center;
             min-height: calc(100vh - 56px);">

  <div style="width: 100%;
               max-width: 360px;
               padding: 0 16px;">

    <div style="background: var(--bg-card);
                 border: 1px solid var(--border);
                 border-top: 2px solid var(--primary);
                 padding: 32px;">

      <div style="display: flex;
                   align-items: center;
                   gap: 10px;
                   margin-bottom: 28px;">
        <svg viewBox="0 0 200 100" fill="none"
             xmlns="http://www.w3.org/2000/svg"
             style="width: 40px; height: 20px; flex-shrink: 0;">
          <text x="2" y="88"
                font-family="Rajdhani, sans-serif"
                font-weight="700" font-size="90"
                fill="var(--primary)"
                letter-spacing="-4">W</text>
          <text x="76" y="88"
                font-family="Rajdhani, sans-serif"
                font-weight="700" font-size="90"
                fill="var(--text)"
                letter-spacing="-4">A</text>
          <path d="M194,8 A36,42 0 1,0 194,94"
                stroke="var(--secondary)"
                stroke-width="10" fill="none"
                stroke-linecap="round"/>
          <polyline points="160,58 170,72 190,46"
                    stroke="var(--secondary)"
                    stroke-width="6" fill="none"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>
        </svg>
        <span style="font-family: 'Rajdhani', sans-serif;
                      font-size: 15px;
                      font-weight: 700;
                      letter-spacing: 0.04em;
                      text-transform: uppercase;
                      color: var(--text);">
          WeAreChecking
        </span>
      </div>

      <h1 style="font-family: 'Rajdhani', sans-serif;
                  font-size: 22px;
                  font-weight: 700;
                  letter-spacing: 0.04em;
                  text-transform: uppercase;
                  color: var(--text);
                  margin-bottom: 8px;">
        Sign In
      </h1>
      <p style="font-size: 11px;
                 color: var(--text-mid);
                 letter-spacing: 0.04em;
                 line-height: 1.6;
                 margin-bottom: 28px;">
        Log in with Discord to track your events and
        access admin pages without saving links.
      </p>

      <form method="post" action="{% url 'discord_login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ login_next }}">
        <button type="submit" class="btn-discord">
          {% include 'partials/discord_icon.html' with w=18 h=14 %}
          Continue with Discord
        </button>
      </form>

      <div style="margin-top: 20px; text-align: center;">
        <a href="{% url 'home' %}"
           style="font-size: 10px;
                   color: var(--text-dim);
                   letter-spacing: 0.08em;
                   text-decoration: none;
                   transition: color 0.15s;"
           onmouseenter="this.style.color='var(--text)'"
           onmouseleave="this.style.color='var(--text-dim)'">
          ← Back to home
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
